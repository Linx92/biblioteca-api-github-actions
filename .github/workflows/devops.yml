name: Workflow dotnet build I

on:
  # push:
  #   branches:
  #     - main
  #     - develop
  workflow_dispatch: 
    inputs:
      dotnetversion:
        description: 'Version to build'
        default: '9.0.x'
        required: false
      artifactname:
        description: 'Artifact name'
        default: 'app.package'
        required: false

permissions:
  id-token: write
  contents: write

env: 
  BUILD_CONFIGURATION: Release  

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract-version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get version from changelog
        id: extract-version
        run: |
          version=$(grep -oPm1 '(?<=## \[)[^\]]+' CHANGELOG.md)
          echo "Extracted version: $VERSION"
          echo "version=$version" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Muestra version
        run: |
          echo "Version: ${{ needs.extract-version.outputs.app_version }}"
      
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ github.event.inputs.dotnetversion || '9.0.x' }}
      
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{env.BUILD_CONFIGURATION}} --no-restore

      - name: publish
        run: dotnet publish --configuration ${{env.BUILD_CONFIGURATION}} --no-build --output ./publish

      - name: Zip artifacts
        run: |
          cd publish
          zip -r ../app.package.zip .
          cd ..
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifactname }}
          path: ${{ github.event.inputs.artifactname }}.zip
          retention-days: 5
  
  DEPLOY:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifactname }}
      - name: Download artifact
        run: echo "Variable a mostrar en ${{vars.VARIABLE_GITHUB}}"