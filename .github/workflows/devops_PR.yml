name: Workflow dotnet build I - PullRequest

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  id-token: write
  contents: write

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract-version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get version from changelog
        id: extract-version
        run: |
          version=$(grep -oP '## \[\K[^\]]+' CHANGELOG.md)
          echo "Extracted version: $VERSION"
          echo "version=$version" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Muestra version
        run: |
          echo "Version: ${{ needs.extract-version.outputs.app_version }}"
      
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      - name: publish
        run: dotnet publish --configuration Release --no-build --output ./publish
      
      - name: Zip artifacts
        run: |
          cd publish
          zip -r ../app.zip .
          cd ..
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          retention-days: 5